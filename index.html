<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTIMATE 3D GRAND PRIX v10</title>
<style>
* { box-sizing:border-box; }
body { margin:0; overflow:hidden; background:#87CEEB; touch-action:none; user-select:none; }
#hud { position:absolute; top:0; left:0; width:100%; pointer-events:none; font-family:'Segoe UI',Impact,sans-serif; }
#speed-box { position:absolute; top:20px; left:20px; display:flex; align-items:baseline; gap:6px; color:#fff; text-shadow:2px 2px 6px rgba(0,0,0,.7); }
#speed { font-size:64px; font-weight:900; font-style:italic; line-height:1; }
#speed-unit { font-size:18px; opacity:.9; }
#time-box { position:absolute; top:110px; left:20px; font-family:'Courier New',monospace; font-size:16px; color:#0f0; background:rgba(0,0,0,.42); padding:5px 10px; border-radius:6px; }
#lap-box  { position:absolute; top:148px; left:20px; font-family:'Courier New',monospace; font-size:14px; color:#ff0; background:rgba(0,0,0,.42); padding:4px 10px; border-radius:6px; }
#gear-box { position:absolute; bottom:110px; right:40px; font-size:90px; font-weight:900; color:#ff0; text-shadow:3px 3px 0 #000; line-height:1; }
#lap-flash { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:40px; font-weight:900; color:#ffd700; text-shadow:0 0 20px #f80,2px 2px 6px #000; opacity:0; pointer-events:none; transition:opacity .12s; white-space:nowrap; }
#help-btn { position:absolute; top:20px; right:20px; z-index:100; width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.5); border:2px solid rgba(255,255,255,.65); color:#fff; font-size:20px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; pointer-events:auto; }
#help-btn:hover { background:rgba(0,0,0,.75); }
#help-overlay { display:none; position:absolute; inset:0; background:rgba(0,0,0,.75); z-index:200; align-items:center; justify-content:center; }
#help-overlay.show { display:flex; }
#help-panel { background:#12122a; border:1px solid rgba(255,255,255,.18); border-radius:16px; padding:28px 34px; max-width:500px; width:92%; color:#fff; font-family:'Segoe UI',sans-serif; max-height:90vh; overflow-y:auto; }
#help-panel h2 { margin:0 0 20px; font-size:22px; font-weight:700; color:#ffd700; text-align:center; }
.hs { margin-bottom:16px; }
.hs h3 { font-size:12px; font-weight:600; color:#888; text-transform:uppercase; letter-spacing:1px; margin:0 0 8px; }
.kr { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.k  { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); border-radius:5px; padding:3px 9px; font-size:12px; font-family:monospace; min-width:32px; text-align:center; white-space:nowrap; }
.kd { font-size:13px; color:#ccc; }
.tip { font-size:12px; color:#999; line-height:1.7; background:rgba(255,255,255,.04); border-radius:8px; padding:9px 13px; }
#close-btn { display:block; width:100%; margin-top:20px; padding:11px; background:#ffd700; color:#000; font-size:14px; font-weight:700; border:none; border-radius:8px; cursor:pointer; }
#close-btn:hover { background:#ffe84d; }
#touch-controls { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; pointer-events:auto; z-index:50; }
.tb { width:60px; height:60px; border-radius:50%; background:rgba(0,0,0,.38); border:2px solid rgba(255,255,255,.5); color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; user-select:none; cursor:pointer; touch-action:none; }
.tb:active { background:rgba(255,255,255,.22); }
</style>
</head>
<body>

<div id="hud">
  <div id="speed-box"><span id="speed">0</span><span id="speed-unit">km/h</span></div>
  <div id="time-box">BEST: --'--"--- | NOW: 00'00"000</div>
  <div id="lap-box">LAP 0 / 3</div>
  <div id="gear-box">N</div>
  <div id="lap-flash"></div>
</div>

<div id="help-btn" onclick="toggleHelp()">?</div>
<div id="help-overlay">
 <div id="help-panel">
  <h2>🏎 操作説明</h2>
  <div class="hs"><h3>走行</h3>
   <div class="kr"><span class="k">↑ W</span><span class="kd">アクセル</span></div>
   <div class="kr"><span class="k">↓ S</span><span class="kd">ブレーキ</span></div>
   <div class="kr"><span class="k">← A</span><span class="kd">左ステア</span></div>
   <div class="kr"><span class="k">→ D</span><span class="kd">右ステア</span></div>
  </div>
  <div class="hs"><h3>カメラ</h3>
   <div class="kr"><span class="k">右ドラッグ</span><span class="kd">視点を自由回転</span></div>
   <div class="kr"><span class="k">ホイール</span><span class="kd">ズームイン／アウト</span></div>
   <div class="kr"><span class="k">ピンチ</span><span class="kd">2本指ズーム（タッチ）</span></div>
   <div class="kr"><span class="k">H / ?</span><span class="kd">このヘルプを表示</span></div>
  </div>
  <div class="hs"><h3>タッチ</h3>
   <div class="kr"><span class="k">▲▼</span><span class="kd">アクセル / ブレーキ</span></div>
   <div class="kr"><span class="k">◀▶</span><span class="kd">ステアリング</span></div>
  </div>
  <div class="hs"><h3>ラップ</h3>
   <div class="tip">黄金のスタート／ゴールゲートを通過するとラップ計測開始。3周完走でベストタイム記録。コースアウト自由！タイヤバリア・看板は吹き飛びます。</div>
  </div>
  <button id="close-btn" onclick="toggleHelp()">▶ スタート！</button>
 </div>
</div>

<div id="touch-controls">
 <div class="tb" id="btn-left">◀</div>
 <div class="tb" id="btn-accel">▲</div>
 <div class="tb" id="btn-brake">▼</div>
 <div class="tb" id="btn-right">▶</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
if(typeof THREE==='undefined'){document.body.innerHTML='<p style="color:#f55;padding:40px;font-family:monospace">Three.js 読み込み失敗。再読み込みしてください。</p>';throw 0;}

// ── ヘルプ ──────────────────────────────────────────────────────────────
function toggleHelp(){ document.getElementById('help-overlay').classList.toggle('show'); }
toggleHelp();

// ── シーン / レンダラー ─────────────────────────────────────────────────
const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog      = new THREE.FogExp2(0xb8d8f0,0.0011);

const camera   = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.3,3000);
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

// ── ライト ──────────────────────────────────────────────────────────────
const SUN=new THREE.DirectionalLight(0xfff8e0,2.0);
SUN.position.set(350,550,220);
SUN.castShadow=true;
SUN.shadow.mapSize.set(4096,4096);
['left','right','top','bottom'].forEach((k,i)=>SUN.shadow.camera[k]=[- 700,700,700,-700][i]);
SUN.shadow.camera.near=1; SUN.shadow.camera.far=1600;
SUN.shadow.bias=-0.0003;
scene.add(SUN);
scene.add(new THREE.HemisphereLight(0xc0e0ff,0x406030,0.8));
scene.add(new THREE.AmbientLight(0xffffff,0.2));

// ── 影ヘルパー ───────────────────────────────────────────────────────────
function sh(m){ m.castShadow=true; m.receiveShadow=true; return m; }
function addS(m){ scene.add(sh(m)); return m; }
function shGrp(g){ g.traverse(c=>{ if(c.isMesh){c.castShadow=true;c.receiveShadow=true;} }); return g; }

// ── マテリアル ───────────────────────────────────────────────────────────
const M={
  asph: new THREE.MeshStandardMaterial({color:0x222222,roughness:0.9,metalness:0.02}),
  curbW:new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.6}),
  curbR:new THREE.MeshStandardMaterial({color:0xcc2222,roughness:0.6}),
  grass:new THREE.MeshStandardMaterial({color:0x2e7d32,roughness:1}),
  tire: new THREE.MeshStandardMaterial({color:0x111111,roughness:0.95}),
  rim:  new THREE.MeshStandardMaterial({color:0xcccccc,metalness:0.9,roughness:0.1}),
  dark: new THREE.MeshStandardMaterial({color:0x111111,roughness:0.5}),
  gate: new THREE.MeshStandardMaterial({color:0xffd700,metalness:0.6,roughness:0.2,emissive:0x332200,emissiveIntensity:0.6}),
  con:  new THREE.MeshStandardMaterial({color:0x888888,roughness:0.9}),
  seat: new THREE.MeshStandardMaterial({color:0xcc2200,roughness:0.8}),
  pole: new THREE.MeshStandardMaterial({color:0xaaaaaa,metalness:0.7,roughness:0.3}),
  bark: new THREE.MeshStandardMaterial({color:0x5d4037,roughness:1}),
  body: c=>new THREE.MeshStandardMaterial({color:c,metalness:0.8,roughness:0.2}),
  signB:new THREE.MeshStandardMaterial({color:0x1144cc,roughness:0.4,metalness:0.3}),
  signY:new THREE.MeshStandardMaterial({color:0xffcc00,roughness:0.4,metalness:0.3}),
  barW: new THREE.MeshStandardMaterial({color:0xdddddd,roughness:0.7}),
  barR: new THREE.MeshStandardMaterial({color:0xcc0000,roughness:0.7}),
};

// ── コース ───────────────────────────────────────────────────────────────
const TW=22;
const curve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(   0,0,   0),new THREE.Vector3( 130,0,  80),
  new THREE.Vector3( 280,0, 200),new THREE.Vector3( 390,0,  30),
  new THREE.Vector3( 310,0,-200),new THREE.Vector3( 120,0,-350),
  new THREE.Vector3(-160,0,-265),new THREE.Vector3(-270,0, -70),
  new THREE.Vector3(-110,0, 100),
],true,'catmullrom',0.5);
const TLEN=curve.getLength();

function strip(hw,yo,mat,flip){
  const pos=[],idx=[],N=350;
  for(let i=0;i<=N;i++){
    const t=i/N,pt=curve.getPointAt(t),tan=curve.getTangentAt(t);
    const r=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    pos.push(pt.x-r.x*hw,yo,pt.z-r.z*hw,pt.x+r.x*hw,yo,pt.z+r.z*hw);
    if(i<N){const a=i*2,b=a+1,c=a+2,d=a+3;flip?idx.push(a,c,b,b,c,d):idx.push(a,b,c,b,d,c);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat); m.receiveShadow=true; scene.add(m); return m;
}
strip(TW,    0.03,M.asph);
strip(TW+2.5,0.02,M.curbR);
strip(TW+5,  0.01,M.curbW);
strip(0.4,   0.04,M.curbW); // センターライン

// 地面
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(9000,9000),M.grass);
gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; scene.add(gnd);

// ── 物理オブジェクト管理 ─────────────────────────────────────────────────
const physObjs=[];
function addPhys(mesh,mass=1){
  const o={mesh,pos:mesh.position.clone(),vel:new THREE.Vector3(),
            angVel:new THREE.Vector3(),quat:mesh.quaternion.clone(),mass};
  physObjs.push(o); return o;
}
function stepPhys(dt){
  for(const o of physObjs){
    o.vel.y-=18*dt;
    o.pos.addScaledVector(o.vel,dt);
    if(o.pos.y<=0){o.pos.y=0;o.vel.y=Math.abs(o.vel.y)*0.3;if(o.vel.y<0.3)o.vel.y=0;}
    const drag=Math.pow(0.87,dt*60);
    o.vel.x*=drag; o.vel.z*=drag; o.vel.y*=Math.pow(0.97,dt*60);
    o.quat.x+=o.angVel.x*dt; o.quat.y+=o.angVel.y*dt; o.quat.z+=o.angVel.z*dt;
    o.quat.normalize();
    o.angVel.multiplyScalar(Math.pow(0.78,dt*60));
    o.mesh.position.copy(o.pos);
    o.mesh.quaternion.copy(o.quat);
  }
}
function smash(o,carVel,dir){
  o.vel.addScaledVector(dir,14+carVel*0.25);
  o.vel.y=Math.max(o.vel.y,3+Math.random()*4);
  o.angVel.set((Math.random()-.5)*9,(Math.random()-.5)*9,(Math.random()-.5)*9);
}

// ── タイヤバリア ─────────────────────────────────────────────────────────
function makeTireStack(pos,rotY){
  const grp=new THREE.Group();
  const row=(y,n,mat)=>{ for(let i=0;i<n;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(0.48,0.21,10,20),mat);t.rotation.x=Math.PI/2;t.position.set((i-(n-1)/2)*1.08,y,0);sh(t);grp.add(t);} };
  row(0.48,3,M.barW); row(1.5,3,M.barR); row(2.5,2,M.barW);
  grp.position.copy(pos); grp.rotation.y=rotY;
  shGrp(grp); scene.add(grp);
  addPhys(grp,90);
  return grp;
}

// ── 看板 ─────────────────────────────────────────────────────────────────
function makeSign(pos,rotY,mat){
  const grp=new THREE.Group();
  for(const x of[-0.92,0.92]){ const p=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,4.5,8),M.pole);p.position.set(x,2.25,0);sh(p);grp.add(p); }
  const b=new THREE.Mesh(new THREE.BoxGeometry(2.3,1.2,0.14),mat);b.position.set(0,3.8,0);sh(b);grp.add(b);
  grp.position.copy(pos); grp.rotation.y=rotY;
  shGrp(grp); scene.add(grp);
  addPhys(grp,35);
  return grp;
}

// ── グランドスタンド ──────────────────────────────────────────────────────
function makeStand(pos,rotY,w=40,rows=6){
  const grp=new THREE.Group();
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w,0.35,rows*1.6*0.6),M.con);
  roof.position.set(0,rows*1.4+1.2,0); sh(roof); grp.add(roof);
  for(let r=0;r<rows;r++){
    const row=new THREE.Mesh(new THREE.BoxGeometry(w,0.28,1.5),M.seat);
    row.position.set(0,r*1.4+0.4,-(rows/2)*1.4+r*1.4+0.75); sh(row); grp.add(row);
    const cols=Math.floor(w/1.85);
    for(let c=0;c<cols;c++){
      const rnd=[0xff6644,0x4466ff,0xffcc00,0x44cc44,0xcc44cc][Math.floor(Math.random()*5)];
      const head=new THREE.Mesh(new THREE.SphereGeometry(0.23,6,5),new THREE.MeshStandardMaterial({color:rnd}));
      head.position.set(-w/2+c*1.85+0.92,r*1.4+1.1,-(rows/2)*1.4+r*1.4+0.75);
      sh(head); grp.add(head);
    }
  }
  const wall=new THREE.Mesh(new THREE.BoxGeometry(w,rows*1.4,0.4),M.con);
  wall.position.set(0,rows*0.7,(rows/2)*1.4); sh(wall); grp.add(wall);
  grp.position.copy(pos); grp.rotation.y=rotY;
  shGrp(grp); scene.add(grp);
}

// ── 木 ───────────────────────────────────────────────────────────────────
function makeTree(px,pz,h=5){
  const grp=new THREE.Group();
  const tk=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.5,h*0.4,8),M.bark);
  tk.position.y=h*0.2; sh(tk); grp.add(tk);
  for(let i=0;i<3;i++){
    const lv=new THREE.Mesh(new THREE.ConeGeometry(1.5+i*0.55,h*0.38,8),
      new THREE.MeshStandardMaterial({color:i%2===0?0x2e7d32:0x388e3c,roughness:1}));
    lv.position.y=h*0.38+(2-i)*h*0.2; sh(lv); grp.add(lv);
  }
  grp.position.set(px,0,pz); shGrp(grp); scene.add(grp);
}

// ── ガードレールポスト ────────────────────────────────────────────────────
function makeRail(t0,t1,sideOff,steps=45){
  for(let i=0;i<steps;i++){
    const t=THREE.MathUtils.lerp(t0,t1,i/steps);
    const pt=curve.getPointAt(t%1);
    const tan=curve.getTangentAt(t%1);
    const r=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    const p=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.1,0.1),M.pole);
    p.position.set(pt.x+r.x*sideOff,0.55,pt.z+r.z*sideOff);
    p.rotation.y=Math.atan2(tan.x,tan.z);
    sh(p); scene.add(p);
    // 横棒
    if(i<steps-1){
      const t2=THREE.MathUtils.lerp(t0,t1,(i+1)/steps);
      const pt2=curve.getPointAt(t2%1);
      const r2=new THREE.Vector3(-curve.getTangentAt(t2%1).z,0,curve.getTangentAt(t2%1).x).normalize();
      const mid=new THREE.Vector3().addVectors(
        pt.clone().addScaledVector(r,sideOff),pt2.clone().addScaledVector(r2,sideOff)).multiplyScalar(0.5);
      const len=pt.clone().addScaledVector(r,sideOff).distanceTo(pt2.clone().addScaledVector(r2,sideOff));
      const bar=new THREE.Mesh(new THREE.BoxGeometry(len+0.05,0.08,0.08),
        new THREE.MeshStandardMaterial({color:0xdddddd,metalness:0.5,roughness:0.3}));
      bar.position.set(mid.x,0.8,mid.z);
      bar.rotation.y=Math.atan2(tan.x,tan.z);
      sh(bar); scene.add(bar);
    }
  }
}

// ── スタート/ゴールゲート ─────────────────────────────────────────────────
const GATE_P=curve.getPointAt(0).clone();
const GATE_T=curve.getTangentAt(0).normalize();
const GATE_R=new THREE.Vector3(-GATE_T.z,0,GATE_T.x).normalize();
const GATE_N=GATE_T.clone();

(function buildGate(){
  const grp=new THREE.Group();
  for(const s of[-1,1]){
    const col=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,11,12),M.gate);
    col.position.set(s*(TW+1.5),5.5,0); sh(col); grp.add(col);
  }
  const beam=new THREE.Mesh(new THREE.BoxGeometry(TW*2+5,0.85,0.85),M.gate);
  beam.position.y=11.4; sh(beam); grp.add(beam);
  const plate=new THREE.Mesh(new THREE.BoxGeometry(TW*2+4,2.0,0.3),
    new THREE.MeshStandardMaterial({color:0xcc0000,emissive:0x440000,emissiveIntensity:0.5}));
  plate.position.y=10.0; sh(plate); grp.add(plate);
  // チェッカーライン
  for(let i=0;i<12;i++){
    const sq=new THREE.Mesh(new THREE.BoxGeometry(TW*2/12,0.02,2.5),
      new THREE.MeshStandardMaterial({color:i%2===0?0xffffff:0x111111}));
    sq.position.set(-TW+i*(TW*2/12)+TW/12,0.05,0); sh(sq); grp.add(sq);
  }
  const angle=Math.atan2(GATE_T.x,GATE_T.z);
  grp.position.set(GATE_P.x,0,GATE_P.z); grp.rotation.y=angle;
  shGrp(grp); scene.add(grp);
})();

// ── 環境配置 ─────────────────────────────────────────────────────────────
// ガードレール（全周）
for(let s=0;s<9;s++){ makeRail(s/9,(s+1)/9, TW+6.5,20); makeRail(s/9,(s+1)/9,-(TW+6.5),20); }

// タイヤバリア（コーナー）
[{t:0.06,s: 30},{t:0.06,s:-30},{t:0.20,s: 30},{t:0.20,s:-30},
 {t:0.34,s: 32},{t:0.34,s:-32},{t:0.48,s: 30},{t:0.48,s:-30},
 {t:0.62,s: 30},{t:0.62,s:-30},{t:0.76,s: 32},{t:0.76,s:-32},
 {t:0.88,s: 30},{t:0.88,s:-30},{t:0.96,s: 28},{t:0.96,s:-28}
].forEach(({t,s})=>{
  const pt=curve.getPointAt(t); const tan=curve.getTangentAt(t);
  const r=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  const pos=pt.clone().addScaledVector(r,s); pos.y=0;
  makeTireStack(pos,Math.atan2(tan.x,tan.z));
});

// 看板
[{t:0.14,s: 40,mat:M.signB},{t:0.28,s:-40,mat:M.signY},{t:0.42,s: 42,mat:M.signB},
 {t:0.56,s:-42,mat:M.signY},{t:0.70,s: 40,mat:M.signB},{t:0.84,s:-40,mat:M.signY},
 {t:0.92,s: 40,mat:M.signB}
].forEach(({t,s,mat})=>{
  const pt=curve.getPointAt(t); const tan=curve.getTangentAt(t);
  const r=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  const pos=pt.clone().addScaledVector(r,s); pos.y=0;
  const rotY=Math.atan2(tan.x,tan.z)+(s>0?0:Math.PI);
  makeSign(pos,rotY,mat);
});

// グランドスタンド
makeStand(new THREE.Vector3(-55,0,-15),  Math.PI*0.55,55,7);
makeStand(new THREE.Vector3(210,0, 130), Math.PI*0.05,45,6);
makeStand(new THREE.Vector3( 95,0,-300), Math.PI*0.30,45,6);
makeStand(new THREE.Vector3(-200,0,-180),Math.PI*0.80,40,5);

// 木（外周）
for(let i=0;i<90;i++){
  const a=(i/90)*Math.PI*2, r=560+Math.random()*280;
  makeTree(Math.cos(a)*r,Math.sin(a)*r,5+Math.random()*5);
}
// コース周辺
for(let i=0;i<60;i++){
  const t=Math.random(); const pt=curve.getPointAt(t);
  const tan=curve.getTangentAt(t);
  const r=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  const s=(Math.random()<0.5?1:-1)*(52+Math.random()*65);
  makeTree(pt.x+r.x*s,pt.z+r.z*s,4+Math.random()*5);
}

// 山
for(let i=0;i<36;i++){
  const h=70+Math.random()*120, a=(i/36)*Math.PI*2;
  const m=new THREE.Mesh(new THREE.ConeGeometry(30+Math.random()*70,h,5),
    new THREE.MeshStandardMaterial({color:i%2===0?0x1b5e20:0x33691e,roughness:1}));
  m.position.set(Math.cos(a)*1150,h/2,Math.sin(a)*1150);
  sh(m); scene.add(m);
}

// ── F1カー ───────────────────────────────────────────────────────────────
function buildCar(col){
  const g=new THREE.Group();
  const bm=M.body(col);

  // モノコック
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.44,3.9),bm); body.position.y=0.44; sh(body); g.add(body);
  // サイドポッド
  for(const sx of[-1,1]){const sp=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,2.1),bm);sp.position.set(sx*0.98,0.32,0.05);sh(sp);g.add(sp);}
  // ノーズ
  const nose=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.38,1.7,10),bm);nose.rotation.x=Math.PI/2;nose.position.set(0,0.34,2.85);sh(nose);g.add(nose);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(0.08,8,6),bm);tip.position.set(0,0.34,3.65);g.add(tip);
  // コクピット
  const ck=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.3,0.9),M.dark);ck.position.set(0,0.7,0.2);sh(ck);g.add(ck);
  // ヘイロー
  const halo=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.04,8,20,Math.PI),M.dark);halo.rotation.y=Math.PI/2;halo.position.set(0,0.88,0.1);g.add(halo);
  // エンジンカバー
  const ec=new THREE.Mesh(new THREE.BoxGeometry(0.72,0.38,1.5),bm);ec.position.set(0,0.74,-0.35);sh(ec);g.add(ec);
  // FW
  const fw=new THREE.Mesh(new THREE.BoxGeometry(2.65,0.06,0.72),M.dark);fw.position.set(0,0.17,2.25);sh(fw);g.add(fw);
  for(const sx of[-1,1]){const ep=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.24,0.72),M.dark);ep.position.set(sx*1.3,0.23,2.25);g.add(ep);}
  // RW
  const rw=new THREE.Mesh(new THREE.BoxGeometry(2.05,0.07,0.58),M.dark);rw.position.set(0,1.0,-1.95);sh(rw);g.add(rw);
  const rw2=new THREE.Mesh(new THREE.BoxGeometry(2.05,0.05,0.36),M.dark);rw2.position.set(0,1.14,-1.78);g.add(rw2);
  for(const sx of[-0.58,0.58]){const rp=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.42,0.07),M.dark);rp.position.set(sx,0.74,-1.95);g.add(rp);}
  for(const sx of[-1,1]){const ep=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.32,0.62),M.dark);ep.position.set(sx*1.0,1.02,-1.88);g.add(ep);}
  // ビームウィング
  const bw=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.05,0.38),bm);bw.position.set(0,0.6,-1.78);g.add(bw);
  // ディフューザー
  const df=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.2,0.65),M.dark);df.position.set(0,0.1,-2.1);df.rotation.x=0.3;g.add(df);
  // フロアエッジ
  for(const sx of[-1,1]){const fe=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.08,3.7),M.dark);fe.position.set(sx*0.78,0.06,0.05);g.add(fe);}

  // タイヤ
  const tireData=[
    {pos:[ 1.13,0.44, 1.52],front:true},
    {pos:[-1.13,0.44, 1.52],front:true},
    {pos:[ 1.13,0.44,-1.52],front:false},
    {pos:[-1.13,0.44,-1.52],front:false},
  ];
  const TG=new THREE.CylinderGeometry(0.44,0.44,0.62,24);
  const RG=new THREE.CylinderGeometry(0.22,0.22,0.63,16);
  const steerGrps=[],spinGrps=[];

  tireData.forEach(({pos,front})=>{
    const sg=new THREE.Group(); sg.position.set(...pos);
    const spin=new THREE.Group();
    const t=new THREE.Mesh(TG,M.tire); t.rotation.z=Math.PI/2; sh(t); spin.add(t);
    const r=new THREE.Mesh(RG,M.rim);  r.rotation.z=Math.PI/2; sh(r); spin.add(r);
    // スポーク
    for(let s=0;s<5;s++){
      const sp=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.38,0.04),M.rim);
      sp.rotation.z=Math.PI/2; sp.rotation.x=(s/5)*Math.PI*2;
      spin.add(sp);
    }
    // タイヤ溝
    for(let gi=0;gi<3;gi++){
      const gr=new THREE.Mesh(new THREE.TorusGeometry(0.44,0.015,6,24),
        new THREE.MeshStandardMaterial({color:0x333333}));
      gr.rotation.z=Math.PI/2; gr.position.set(0,(gi-1)*0.18,0); spin.add(gr);
    }
    sg.add(spin); g.add(sg);
    steerGrps.push({grp:sg,front}); spinGrps.push(spin);
  });

  return {mesh:g,steerGrps,spinGrps};
}

const CAR=buildCar(0xcc0000);
shGrp(CAR.mesh); scene.add(CAR.mesh);
const CAR_R=2.6; // 衝突半径

// ── 初期位置 ────────────────────────────────────────────────────────────
const SP=curve.getPointAt(0).clone();
const ST=curve.getTangentAt(0).normalize();
let carYaw=Math.atan2(ST.x,ST.z);
let carPos=SP.clone(); carPos.y=0.44;
let carVel=0, steerA=0;

CAR.mesh.position.copy(carPos);
camera.position.set(carPos.x-ST.x*14,carPos.y+5,carPos.z-ST.z*14);
camera.lookAt(carPos.x,carPos.y+1.2,carPos.z);

// ── 入力 ────────────────────────────────────────────────────────────────
const inp={up:false,dn:false,lt:false,rt:false};
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'   ||e.key==='w')inp.up=true;
  if(e.key==='ArrowDown' ||e.key==='s')inp.dn=true;
  if(e.key==='ArrowLeft' ||e.key==='a')inp.lt=true;
  if(e.key==='ArrowRight'||e.key==='d')inp.rt=true;
  if(e.key==='?'||e.key==='h')toggleHelp();
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'   ||e.key==='w')inp.up=false;
  if(e.key==='ArrowDown' ||e.key==='s')inp.dn=false;
  if(e.key==='ArrowLeft' ||e.key==='a')inp.lt=false;
  if(e.key==='ArrowRight'||e.key==='d')inp.rt=false;
});
['btn-accel','btn-brake','btn-left','btn-right'].forEach((id,i)=>{
  const key=['up','dn','lt','rt'][i];
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();inp[key]=true;},{passive:false});
  el.addEventListener('touchend',  e=>{e.preventDefault();inp[key]=false;});
  el.addEventListener('mousedown', ()=>inp[key]=true);
  el.addEventListener('mouseup',   ()=>inp[key]=false);
  el.addEventListener('mouseleave',()=>inp[key]=false);
});

// ── カメラ制御 ───────────────────────────────────────────────────────────
let camYaw=0,camPitch=0.22,camZoom=13;
let orbiting=false,lastMX=0,lastMY=0;

renderer.domElement.addEventListener('mousedown',e=>{if(e.button===2){orbiting=true;lastMX=e.clientX;lastMY=e.clientY;}});
window.addEventListener('mouseup',e=>{if(e.button===2)orbiting=false;});
window.addEventListener('mousemove',e=>{
  if(!orbiting)return;
  camYaw  -=(e.clientX-lastMX)*0.006;
  camPitch=Math.max(0.05,Math.min(1.25,camPitch+(e.clientY-lastMY)*0.006));
  lastMX=e.clientX;lastMY=e.clientY;
});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('wheel',e=>{e.preventDefault();camZoom=Math.max(4,Math.min(36,camZoom+e.deltaY*0.025));},{passive:false});
let lp=null;
window.addEventListener('touchstart',e=>{if(e.touches.length===2)lp=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
window.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&lp!==null){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    camZoom=Math.max(4,Math.min(36,camZoom-(d-lp)*0.05));lp=d;
  }
},{passive:true});
window.addEventListener('touchend',()=>lp=null,{passive:true});

// ── ギア ────────────────────────────────────────────────────────────────
const GR=[0,55,115,175,235,295,342];
function gear(kmh){if(kmh<=0)return'N';for(let g=1;g<GR.length;g++)if(kmh<GR[g])return String(g);return String(GR.length-1);}

// ── ラップ計測 ───────────────────────────────────────────────────────────
const TOTAL=3;
let lapN=0,lapOn=false,lapStart=0,best=Infinity;
let gDot=null;
function fmt(s){const m=Math.floor(s/60),ss=Math.floor(s%60),ms=Math.floor((s%1)*1000);return`${String(m).padStart(2,'0')}'${String(ss).padStart(2,'0')}"${String(ms).padStart(3,'0')}`;}
function flash(msg){const f=document.getElementById('lap-flash');f.textContent=msg;f.style.opacity='1';setTimeout(()=>f.style.opacity='0',2400);}

// ── カメラ・注視点 ───────────────────────────────────────────────────────
const camDest=new THREE.Vector3();
const lookDest=new THREE.Vector3();

// ── メインループ ─────────────────────────────────────────────────────────
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);

  if(document.getElementById('help-overlay').classList.contains('show')){renderer.render(scene,camera);return;}

  // 車の物理
  if(inp.up)       carVel+=34*dt;
  else if(inp.dn)  carVel-=58*dt;
  else             carVel-=10*dt;
  carVel=Math.max(0,Math.min(carVel,95));

  const si=(inp.lt?1:0)-(inp.rt?1:0);
  if(si!==0) steerA=THREE.MathUtils.lerp(steerA,si,7*dt);
  else       steerA=THREE.MathUtils.lerp(steerA,0,4*dt);

  // ヨー（フリードライブ: コース拘束なし）
  carYaw+=steerA*carVel*0.022/(1+carVel*0.02)*dt;

  const fwd=new THREE.Vector3(Math.sin(carYaw),0,Math.cos(carYaw));
  carPos.addScaledVector(fwd,carVel*dt);
  carPos.y=0.44;

  CAR.mesh.position.copy(carPos);
  const qL=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),carYaw);
  const qR=new THREE.Quaternion().setFromAxisAngle(fwd,-steerA*0.16*Math.min(carVel/20,1));
  CAR.mesh.quaternion.copy(qR).multiply(qL);

  // タイヤ
  const sp=carVel*0.5*dt;
  CAR.spinGrps.forEach(s=>s.rotation.x+=sp);
  CAR.steerGrps.forEach(({grp,front})=>{if(front)grp.rotation.y=steerA*0.5;});

  // 衝突（物理オブジェクト）
  for(const o of physObjs){
    const dx=o.pos.x-carPos.x, dz=o.pos.z-carPos.z;
    if(Math.sqrt(dx*dx+dz*dz)<CAR_R+2.0){
      smash(o,carVel,new THREE.Vector3(dx,0,dz).normalize());
    }
  }

  // 物理ステップ
  stepPhys(dt);

  // カメラ（右ドラッグ視点 + ズーム）
  const ty=carYaw+camYaw;
  const cx=carPos.x+Math.sin(ty)*Math.cos(camPitch)*camZoom;
  const cy=carPos.y+Math.sin(camPitch)*camZoom;
  const cz=carPos.z+Math.cos(ty)*Math.cos(camPitch)*camZoom;
  camDest.set(cx,cy,cz);
  camera.position.lerp(camDest,0.20);
  lookDest.set(carPos.x,carPos.y+1.2,carPos.z);
  // 注視点 lerp（追従を強く）
  const lc=camera.position.clone();
  lc.lerp(lookDest,1); // 直接 lookAt
  camera.lookAt(lookDest);

  // ラップ計測（ゲートの法線方向の符号変化で検出）
  const toG=carPos.clone().sub(GATE_P); toG.y=0;
  const dot=toG.dot(GATE_N);
  const lat=toG.clone().sub(GATE_N.clone().multiplyScalar(dot));
  if(gDot!==null && lat.length()<TW*1.6){
    if(gDot<0&&dot>=0){
      const now=clock.elapsedTime;
      if(!lapOn){lapOn=true;lapStart=now;flash('LAP スタート！');}
      else{
        const lt=now-lapStart;
        lapN++;
        if(lt<best)best=lt;
        lapStart=now;
        if(lapN>=TOTAL){flash(`FINISH！ BEST ${fmt(best)}`);lapN=0;lapOn=false;}
        else flash(`LAP ${lapN} — ${fmt(lt)}`);
      }
    }
  }
  gDot=dot;

  // UI
  const kmh=Math.floor(carVel*3.6);
  document.getElementById('speed').textContent=kmh;
  document.getElementById('gear-box').textContent=gear(kmh);
  const n=clock.elapsedTime;
  const ln=lapOn?(n-lapStart):0;
  document.getElementById('time-box').textContent=`BEST: ${best<Infinity?fmt(best):'--\'--"---'} | NOW: ${fmt(ln)}`;
  document.getElementById('lap-box').textContent=`LAP ${lapN} / ${TOTAL}  ${lapOn?'● REC':''}`;

  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
